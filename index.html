    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
        .image-container { position: relative; width: 100%; height: 100%; overflow: hidden; background: linear-gradient(135deg, #1f2937 0%, #111827 100%); }
        .image-container img { width: 100%; height: 100%; object-fit: cover; }

<body class="bg-black text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function TattooStudioApp() {
            const [menuOpen, setMenuOpen] = useState(false);
            const [adminMode, setAdminMode] = useState(false);
            const [images, setImages] = useState({});

            // Load images from local storage on mount
            useEffect(() => {
                const saved = localStorage.getItem('tattooImages');
                if (saved) {
                    setImages(JSON.parse(saved));
                }
            }, []);

            // Save images to local storage
            const saveImage = (key, url) => {
                const updated = { ...images, [key]: url };
                setImages(updated);
                localStorage.setItem('tattooImages', JSON.stringify(updated));
                alert(`✅ Image saved! Refresh the page to see changes.`);
            };

            const handleImageUpload = (key, e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        saveImage(key, event.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const studioInfo = {
                name: "The Kala Culture",
                tagline: "Best Tattoo Studio in Vadodara",
                artist: "Jaimin Parmar",
                experience: "10+ Years of Experience",
                address: "102, Neelkanth Gold Complex, Vasna - Bhayli Main Rd, Saiyed Vasna, Vadodara, Gujarat 390020",
                phone: "+91 9157714414",
                email: "thekalaculture0@gmail.com",
                website: "thekalaculturetattoos.in",
                instagram: "@thekalaaculturetattoos",
            };

                { title: "Realistic Portrait Tattoos", description: "Hyper-realistic portrait designs with exceptional detail and precision" },
                { title: "Custom Tattoo Designs", description: "Personalized designs tailored to your vision with professional consultation" },
                { title: "Fine Line & Minimal Tattoos", description: "Delicate, elegant minimalist designs for subtle self-expression" },
                { title: "Name & Signature Tattoos", description: "Personalized name and signature tattoos with custom lettering" },
                { title: "Religious Tattoos", description: "Spiritual and religious designs with cultural significance and precision" },
                { title: "Couple & Matching Tattoos", description: "Connected designs for couples that complement each other perfectly" }
            ];

            const testimonials = [
                { text: "I recently got a sleeve tattoo done at Kala Culture Tattoo Studio, and I couldn't be happier with the experience. The artist was incredibly professional and took time to understand my vision. Highly recommend!", author: "Ujjwal Panchal", date: "Recently", location: "Vadodara" },

                { text: "Highly recommended! The team is skilled, hygienic, and very friendly. They made my first tattoo experience stress-free and amazing.", author: "Satisfied Client", date: "Recent", location: "Vadodara" }
            ];

                { num: "01", title: "Consultation", desc: "Discuss your tattoo idea, placement, and design preferences with our expert artist" },
                { num: "02", title: "Design", desc: "Custom design created and sized to scale for your approval" },
                { num: "03", title: "Inking", desc: "Professional execution with sterilized equipment and premium inks" },
                { num: "04", title: "Aftercare", desc: "Complete aftercare kit and detailed healing instructions provided" }

                { id: 'gallery3', type: "Realistic Tattoo" },

                                />

                                        {images.artist ? (
